<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login ADM</title>

<style>
  html, body{
  max-width:100%;
  overflow-x:hidden;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#1e1e1e;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.login-box{
  background:#2f2f2f;
  padding:30px;
  border-radius:10px;
  width:320px;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.login-box h1{
  text-align:center;
  color:#ffbb00;
  margin-bottom:20px;
}

.login-box input{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border:none;
  border-radius:6px;
  font-size:15px;
}

.login-box button{
  width:100%;
  padding:12px;
  background:#ffbb00;
  color:#333;
  border:none;
  border-radius:6px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login-box button:hover{
  background:#ffc845;
}

.erro{
  color:#ff6b6b;
  text-align:center;
  margin-top:10px;
  display:none;
}
</style>
</head>

<body>

<div class="login-box">
  <h1>Login ADM</h1>

  <input type="text" id="usuario" placeholder="Usuário">
  <input type="password" id="senha" placeholder="Senha">

  <button onclick="logar()">Entrar</button>

  <div class="erro" id="erro">Usuário ou senha inválidos</div>
</div>

<script>
function logar(){
  const usuario = document.getElementById("usuario").value;
  const senha = document.getElementById("senha").value;

  // 🔐 CREDENCIAIS ADM (MUDE DEPOIS)
  if(usuario === "admin" && senha === "1234"){
    localStorage.setItem("admLogado", "true");
    window.location.href = "painel-adm.html";
  } else {
    document.getElementById("erro").style.display = "block";
  }
}
</script>

</body>
</html>
